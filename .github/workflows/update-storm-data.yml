name: Update storm data

on:
  schedule:
    - cron: "10 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:build
      - name: Commit updated source data
        run: |
          if git diff --quiet -- public/data app/data/generated; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data app/data/generated
          git commit -m "chore: update storm data"
          git push
